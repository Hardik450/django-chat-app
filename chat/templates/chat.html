{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f2f6;
      margin: 0;
      padding: 0;
    }

    .chat-container {
      max-width: 600px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
    }

    .chat-header {
      background-color: #4a69bd;
      color: white;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #ecf0f1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      word-wrap: break-word;
      display: inline-block;
    }

    .own {
      align-self: flex-end;
      background-color: #4a69bd;
      color: white;
      text-align: right;
      border-top-right-radius: 0;
    }

    .other {
      align-self: flex-start;
      background-color: #dff9fb;
      color: #000;
      text-align: left;
      border-top-left-radius: 0;
    }

    .sender {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 4px;
      display: block;
    }

    .chat-input {
      display: flex;
      border-top: 1px solid #ccc;
    }

    #msgInput {
      flex: 1;
      padding: 12px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 0 20px;
      background-color: #4a69bd;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #2e59d9;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">Hello {{ user.username }}</div>

  <div class="chat-box" id="chat-box">
    {% for msg in messages %}
      <div class="message {% if msg.sender == user.username %}own{% else %}other{% endif %}">
        <span class="sender">{{ msg.sender }}</span>
        {{ msg.message }}
      </div>
    {% endfor %}
  </div>

  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const room = 'globalroom';
  const user = "{{ user.username }}";
  const socket = new WebSocket(`ws://${window.location.host}/ws/chat/${room}/`);

  const chatBox = document.getElementById("chat-box");

  socket.onmessage = function (e) {
    const data = JSON.parse(e.data);
    const div = document.createElement("div");
    div.className = `message ${data.sender === user ? "own" : "other"}`;
    div.innerHTML = `<span class="sender">${data.sender}</span>${data.message}`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMessage() {
    const msgInput = document.getElementById("msgInput");
    const msg = msgInput.value;
    if (msg.trim() !== "") {
      socket.send(JSON.stringify({ 'sender': user, 'message': msg }));
      msgInput.value = '';
    }
  }

  window.onload = function () {
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>
</body>
</html>
